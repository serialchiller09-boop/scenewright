<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenewright</title>
<style>
body{margin:0;background:#0c0d10;color:#e8e6df;font:16px/1.4 system-ui;padding:16px}
h1{font-size:20px;margin:0 0 8px}h1 b{color:#c4a574;font-weight:600}
.muted{color:#9a9588;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,input,textarea{font:inherit;color:inherit;background:#13151b;border:1px solid #2a2e3a;border-radius:8px;padding:10px 12px}
button{cursor:pointer}
button.p{border-color:#c4a574;color:#c4a574}
textarea{width:100%;min-height:100px}
.card{background:#13151b;border:1px solid #2a2e3a;border-radius:8px;padding:12px;margin:10px 0}
.prompt{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;background:#000;padding:10px;border-radius:6px}
.err{color:#c47a5c}
</style>
</head>
<body>
<h1>Scene<b>wright</b></h1>
<p class="muted">Paste a chapter. Lock faces. Copy prompts into Grok Imagine.</p>
<div class="row">
  <button class="p" type="button" id="btnSample">Load sample</button>
  <button type="button" id="btnNew">New</button>
</div>
<div class="row" id="nav"></div>
<div id="err" class="err"></div>
<main id="main"></main>
<script>
function showErr(e){
  var box=document.getElementById("err");
  if(box) box.textContent=String(e && e.message ? e.message : e);
}
try {
var state={step:0,p:null};
function $(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,8)}
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g, String.fromCharCode(38)+"amp;")
    .replace(/</g, String.fromCharCode(38)+"lt;")
    .replace(/>/g, String.fromCharCode(38)+"gt;")
    .replace(/"/g, String.fromCharCode(38)+"quot;");
}
function styleP(s){
  s=s||{};
  var out=[s.medium,s.camera,s.lighting];
  if(s.palette) out.push("Palette: "+s.palette);
  if(s.forbidden) out.push("Forbidden: "+s.forbidden);
  return out.filter(Boolean).join(". ");
}
function compile(p,sc){
  p=p||{}; sc=sc||{};
  var loc=(p.locations||[]).filter(function(l){return l.id===sc.loc})[0]||{};
  var chars=(sc.cast||[]).map(function(id){
    var c=(p.characters||[]).filter(function(x){return x.id===id})[0];
    if(!c) return "";
    var ward=c.wardrobe||[];
    var w=ward.filter(function(x){return x.id===(sc.ward||{})[id]})[0]||ward[0]||{};
    return "Same person as the lock plate: "+(c.block||c.name)+". "+(w.desc||"");
  }).filter(Boolean).join(" ");
  var parts=[styleP(p.style),"Shot: "+(sc.shot||"MS")+". Aspect: landscape."];
  if(loc.block) parts.push("Same place as the location plate: "+loc.block+".");
  if(chars) parts.push(chars);
  parts.push(sc.frame||sc.beat||"");
  return parts.filter(Boolean).join(" ");
}
function sample(){
  return {
    title:"Beech Street",
    story:"Rain on Beech Street. Mara Quinn climbed the steps of number twelve in soaked navy scrubs. In the narrow kitchen she filled the yellow kettle with her coat still on, then hung it on the chair. Tom came in with the mail, shook his grey coat, and they stood by the kettle. Later they sat on the olive settee by the gas fire. She closed her eyes. Scrubs still on.",
    style:{medium:"Cinematic still photograph, British kitchen-sink realism, natural tired skin",camera:"shallow depth on faces",lighting:"practical light only",palette:"navy, mustard kettle, fire orange, wet grey",forbidden:"text, beauty filter, anime, logos"},
    characters:[
      {id:"m",name:"Mara Quinn",age:"34",block:"34-year-old white woman, 5 foot 6, compact, tired rounded shoulders, oval face, deep-set grey-green eyes, centre-part dark brown hair stuck to her cheeks from rain, red lanyard line on her throat.",wardrobe:[
        {id:"a",label:"wet-coat",desc:"navy V-neck scrubs under soaked navy coat, black clogs"},
        {id:"b",label:"scrubs",desc:"navy V-neck scrubs, coat off, black clogs, damp hair"}]},
      {id:"t",name:"Tom Quinn",age:"36",block:"36-year-old white man, 6 foot 1, lean-tall, long face, dark stubble, rain-flat dark hair with widows peak.",wardrobe:[
        {id:"c",label:"wet-coat",desc:"wet grey wool coat, white shirt, charcoal trousers, brown brogues, mail under arm"},
        {id:"d",label:"coat-off",desc:"white shirt no tie, charcoal trousers, brown brogues, coat off"}]}
    ],
    locations:[
      {id:"k",name:"Kitchen",block:"narrow British terrace galley, pale lino, yellow drum kettle on back ring, ginger tom on washer, bare overhead bulb"},
      {id:"r",name:"Sitting room",block:"small front room, olive settee, coal-effect gas fire, dark rainy window, no overhead light"}
    ],
    scenes:[
      {title:"S01 Steps",beat:"Arrives soaked",frame:"On wet terrace steps, keys in hand, coat on.",shot:"WS",loc:"k",cast:["m"],ward:{m:"a"}},
      {title:"S02 Kettle",beat:"Coat still on",frame:"Fills the yellow kettle, coat dripping on lino.",shot:"MS",loc:"k",cast:["m"],ward:{m:"a"}},
      {title:"S03 Coat off",beat:"Coat on chair",frame:"Coat on the chair in a puddle. She touches the red throat line.",shot:"MCU",loc:"k",cast:["m"],ward:{m:"b"}},
      {title:"S04 Tom enters",beat:"Mail in the doorway",frame:"Tom in the doorway shaking a wet grey coat, mail under his arm.",shot:"MS",loc:"k",cast:["m","t"],ward:{m:"b",t:"c"}},
      {title:"S05 Two-shot",beat:"Kettle and two people",frame:"Wide galley: two standing figures, yellow kettle, cat on washer.",shot:"WS",loc:"k",cast:["m","t"],ward:{m:"b",t:"d"}},
      {title:"S06 Fire",beat:"Settee button",frame:"On the olive settee by the gas fire, her eyes closed, scrubs still on.",shot:"MCU",loc:"r",cast:["m","t"],ward:{m:"b",t:"d"}}
    ]
  };
}
function blank(){
  return {title:"Untitled",story:"",style:{medium:"Cinematic still photograph, natural skin, practical light",camera:"",lighting:"",palette:"",forbidden:"text, logos, anime"},characters:[],locations:[],scenes:[]};
}
try{
  state.p=JSON.parse(localStorage.getItem("sw.p")||"null")||blank();
}catch(e2){
  state.p=blank();
}
if(!state.p.style) state.p=blank();
function save(){
  try{localStorage.setItem("sw.p",JSON.stringify(state.p))}catch(e3){}
}
function extract(){
  var p=state.p;
  var names=p.story.match(/\b[A-Z][a-z]{2,}(?:\s+[A-Z][a-z]{2,})?/g)||[];
  var stop={The:1,And:1,With:1,From:1,That:1,They:1,When:1,She:1,His:1,Her:1,Then:1,Rain:1,Later:1,In:1};
  var count={},i,n,first;
  for(i=0;i<names.length;i++){
    n=names[i]; first=n.split(" ")[0];
    if(!stop[first]) count[n]=(count[n]||0)+1;
  }
  var leads=[];
  for(n in count) if(count[n]>=2) leads.push(n);
  if(!p.characters.length){
    p.characters=leads.slice(0,4).map(function(name){return {id:uid(),name:name,age:"",block:"",wardrobe:[{id:uid(),label:"default",desc:""}]}});
  }
  if(!p.locations.length) p.locations=[{id:uid(),name:"Primary room",block:""}];
  if(!p.scenes.length){
    var bits=p.story.split(/\n\s*\n/).filter(function(x){return x.trim().length>40}).slice(0,10);
    if(!bits.length && p.story.trim()) bits=[p.story.trim()];
    p.scenes=bits.map(function(ex,idx){
      return {title:"S"+("0"+(idx+1)).slice(-2),beat:ex.split(/[.!?]/)[0],frame:"",shot:"MS",loc:p.locations[0].id,cast:p.characters.slice(0,2).map(function(c){return c.id}),ward:{}};
    });
  }
  state.step=1; save(); draw();
}
function draw(){
  showErr("");
  var nav=$("nav");
  var steps=["Story","Bible","Scenes","Export"];
  var html="",i;
  for(i=0;i<steps.length;i++){
    html+='<button type="button" data-step="'+i+'"'+(state.step===i?' class="p"':'')+'>'+(i+1)+" "+steps[i]+"</button>";
  }
  nav.innerHTML=html;
  var p=state.p, main=$("main");
  if(state.step===0){
    main.innerHTML='<div class="card"><div class="muted">Title</div><input id="title" value="'+esc(p.title)+'"><div class="muted">Chapter</div><textarea id="story">'+esc(p.story)+'</textarea><div class="row"><button class="p" type="button" id="go">Extract + cut scenes</button></div></div>';
    $("title").oninput=function(){p.title=this.value;save()};
    $("story").oninput=function(){p.story=this.value;save()};
    $("go").onclick=extract;
    return;
  }
  if(state.step===1){
    html='<div class="card"><div class="muted">Style lock</div><input id="medium" value="'+esc(p.style.medium||"")+'"><input id="light" value="'+esc(p.style.lighting||"")+'" placeholder="Lighting"><input id="pal" value="'+esc(p.style.palette||"")+'" placeholder="Palette"></div>';
    for(i=0;i<p.characters.length;i++){
      var c=p.characters[i];
      html+='<div class="card"><strong>'+esc(c.name)+'</strong><input data-ca="'+i+'" data-k="age" value="'+esc(c.age||"")+'" placeholder="Age"><textarea data-ca="'+i+'" data-k="block" placeholder="Identity paragraph">'+esc(c.block||"")+'</textarea>';
      var w=c.wardrobe||[];
      for(var wi=0;wi<w.length;wi++) html+='<input data-ca="'+i+'" data-w="'+wi+'" value="'+esc(w[wi].desc||"")+'" placeholder="Wardrobe">';
      html+="</div>";
    }
    for(i=0;i<p.locations.length;i++){
      html+='<div class="card"><strong>'+esc(p.locations[i].name)+'</strong><textarea data-lo="'+i+'">'+esc(p.locations[i].block||"")+'</textarea></div>';
    }
    html+='<div class="row"><button type="button" id="addc">Add character</button><button type="button" id="addl">Add location</button><button class="p" type="button" id="toscenes">Compile scenes</button></div>';
    main.innerHTML=html;
    $("medium").oninput=function(){p.style.medium=this.value;save()};
    $("light").oninput=function(){p.style.lighting=this.value;save()};
    $("pal").oninput=function(){p.style.palette=this.value;save()};
    [].forEach.call(document.querySelectorAll("[data-ca]"),function(el){
      el.oninput=function(){
        var ch=p.characters[+el.getAttribute("data-ca")];
        var ww=el.getAttribute("data-w");
        if(ww!=null) ch.wardrobe[+ww].desc=el.value;
        else ch[el.getAttribute("data-k")]=el.value;
        save();
      };
    });
    [].forEach.call(document.querySelectorAll("[data-lo]"),function(el){
      el.oninput=function(){p.locations[+el.getAttribute("data-lo")].block=el.value;save()};
    });
    $("addc").onclick=function(){p.characters.push({id:uid(),name:"New",age:"",block:"",wardrobe:[{id:uid(),label:"default",desc:""}]});save();draw()};
    $("addl").onclick=function(){p.locations.push({id:uid(),name:"New place",block:""});save();draw()};
    $("toscenes").onclick=function(){state.step=2;save();draw()};
    return;
  }
  if(state.step===2){
    html="";
    for(i=0;i<p.scenes.length;i++){
      var s=p.scenes[i];
      html+='<div class="card"><strong>'+esc(s.title)+'</strong><div class="muted">'+esc(s.beat||"")+'</div><textarea data-fr="'+i+'">'+esc(s.frame||"")+'</textarea><div class="prompt">'+esc(compile(p,s))+'</div><button type="button" data-cp="'+i+'">Copy prompt</button></div>';
    }
    html+='<div class="row"><button class="p" type="button" id="toex">Export pack</button></div>';
    main.innerHTML=html;
    [].forEach.call(document.querySelectorAll("[data-fr]"),function(el){
      el.oninput=function(){p.scenes[+el.getAttribute("data-fr")].frame=el.value;save()};
    });
    [].forEach.call(document.querySelectorAll("[data-cp]"),function(el){
      el.onclick=function(){
        var text=compile(p,p.scenes[+el.getAttribute("data-cp")]);
        if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text);
        el.textContent="Copied";
      };
    });
    $("toex").onclick=function(){state.step=3;draw()};
    return;
  }
  var lines=["# "+p.title];
  for(i=0;i<p.characters.length;i++){
    var ch=p.characters[i];
    var wd=(ch.wardrobe&&ch.wardrobe[0]&&ch.wardrobe[0].desc)||"";
    lines.push("LOCK "+ch.name+" (portrait)");
    lines.push(styleP(p.style)+". Neutral full-body lock plate. "+(ch.block||"")+". "+wd+". Standing still, full body.");
  }
  for(i=0;i<p.locations.length;i++){
    lines.push("LOCK "+p.locations[i].name+" (landscape)");
    lines.push(styleP(p.style)+". Empty establishing shot. "+(p.locations[i].block||""));
  }
  for(i=0;i<p.scenes.length;i++){
    lines.push("## "+p.scenes[i].title);
    lines.push(compile(p,p.scenes[i]));
  }
  main.innerHTML='<div class="card"><p class="muted">Grok Imagine: lock cards first, then S01-S03, then the rest.</p><div class="prompt" id="pack">'+esc(lines.join("\n\n"))+'</div><div class="row"><button class="p" type="button" id="cpack">Copy all</button></div></div>';
  $("cpack").onclick=function(){
    var t=$("pack").innerText;
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t);
  };
}
$("nav").onclick=function(e){
  var t=e.target;
  if(t && t.getAttribute && t.getAttribute("data-step")!=null){
    state.step=+t.getAttribute("data-step");
    draw();
  }
};
$("btnSample").onclick=function(){state.p=sample();state.step=2;save();draw()};
$("btnNew").onclick=function(){state.p=blank();state.step=0;save();draw()};
draw();
} catch (err) {
  showErr(err);
}
</script>
</body>
</html>
